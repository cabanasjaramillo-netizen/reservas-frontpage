<!doctype html>
<!-- La API desplegada necesita B-25 para los importes de plataforma y B-28 para Srta.
     La API no tiene búsqueda global por titular: se busca por nombre en el mes del calendario
     y por folio directamente en el expediente, sin límite de mes.
     La carga y la firma por folio dependen de B-50 y B-63.
     Los avisos de cine parcial no tienen contrato de hospedaje para ofrecer ese reembolso. -->
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cabañas Jaramillo · Sistema de reservas</title>
<script id="cj-config">var CJ_CONFIG = { API_URL: "https://script.google.com/macros/s/AKfycbzH9tlK5InzbLG63IQUnHcKW0LZSCVF8TD2EKeZcXNA7ZJoJAoG0bck69TvPZTDcUVh/exec", CLIENT_ID: "545575090216-0sbn33fujkca7hur7m4poi2t54gr373a.apps.googleusercontent.com" };</script>
<style>
:root {
  --green:#424B24; --terr:#C65D47; --bark:#A25335; --cream:#E5D0AB; --ivory:#F4EFE5;
  --ink:#242820; --muted:#5e6558; --line:#e6e5df; color-scheme:light;
}
* { box-sizing:border-box }
html { scroll-padding:85px 0 calc(85px + env(safe-area-inset-bottom)) }
body { margin:0; background:var(--ivory); color:var(--ink); font:16px/1.5 "Clear Sans",system-ui,sans-serif }
button,input,select,textarea { font:inherit; color:inherit; touch-action:manipulation }
button { cursor:pointer }
button:disabled { cursor:default; opacity:.6 }
:focus-visible { outline:3px solid var(--green); outline-offset:2px }
[hidden] { display:none !important }
.shell { max-width:920px; min-height:100dvh; margin:auto; padding-bottom:calc(96px + env(safe-area-inset-bottom)) }
.top { position:sticky; top:0; z-index:1; background:var(--ivory); border-bottom:1px solid #e4dfd4; padding:12px 16px }
.brand { display:flex; align-items:center; gap:10px }
.brand img { flex:none; width:37px; height:37px }
.eyebrow { color:var(--green); font-size:12px; text-transform:uppercase; letter-spacing:.08em; font-weight:800 }
h1 { margin:0; font:500 20px/1.25 "CMU Serif Light",Georgia,serif }
main { max-width:780px; margin:auto; padding:16px }
h2,h3,p { overflow-wrap:anywhere }
h2 { margin:0; line-height:1.3; font-size:24px }
h3 { margin:0 0 16px; font-size:20px; line-height:1.35 }
.heading { margin-bottom:24px }
.sub { margin:5px 0 0; font-size:14px; color:var(--muted) }
.card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px; margin:0 0 16px; box-shadow:0 1px 2px #424b2410 }
.btn,.iconbtn,.link { min-height:44px; border:0; border-radius:12px; padding:10px 14px; font-weight:700 }
.btn { background:var(--green); color:var(--ivory) }
.secondary { background:var(--cream); color:var(--green) }
.full { width:100% }
.link { color:var(--green); background:none; text-align:left; text-decoration:underline }
.buttons { display:flex; flex-wrap:wrap; gap:8px }
.buttons > * { flex:1 }
.management { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px }
.management button { overflow-wrap:anywhere }
@media (max-width:360px) {
  .management { grid-template-columns:minmax(0,1fr) }
}
nav { position:fixed; z-index:2; bottom:0; left:50%; transform:translateX(-50%); width:min(920px,100%); background:#fff; display:grid; grid-template-columns:repeat(3,1fr); padding:8px 8px max(8px,env(safe-area-inset-bottom)); border-top:1px solid var(--line) }
nav button { border:0; color:var(--muted); background:none; border-radius:12px; display:grid; justify-items:center; gap:4px; padding:8px 4px; font-size:12px; min-height:44px }
nav [aria-current] { color:var(--green); background:#eef0e6; font-weight:700 }
nav svg { width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linejoin:round; stroke-linecap:round }
.calendar-head { display:flex; align-items:center; justify-content:space-between; gap:5px; margin:4px 0 14px }
.calendar-head h3 { margin:0; font-size:18px }
.iconbtn { background:#fff; border:1px solid var(--line); width:44px; flex:none; padding:0; font-size:23px }
.weekdays,.month-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px }
.weekdays { margin-bottom:6px; text-align:center; font-size:12px; color:var(--muted); font-weight:700 }
.day { border:1px solid var(--line); background:#fff; border-radius:8px; min-height:60px; display:flex; flex-direction:column; align-items:center; gap:8px; padding:7px 1px; font-size:14px; font-weight:700 }
.day.occupied { background:#fffdf8 }
.num { width:23px; height:23px; display:grid; place-items:center }
[aria-current="date"] .num { background:var(--green); color:#fff; border-radius:50% }
.marks,.legend { display:flex; align-items:center; gap:3px }
.mark { width:12px; height:8px; border-radius:2px; border:1px solid #d8ddcf; background:#eef0e9 }
.caiman { --cab:var(--green); --pale:#bcc7a7 }
.mariposa { --cab:var(--terr); --pale:#f0b8a9 }
.apartada { background:var(--cab); border-color:var(--cab) }
.plataforma { background:var(--pale); border:1px dashed var(--cab) }
.legend { gap:12px; flex-wrap:wrap; margin:12px 0 4px; font-size:14px }
.legend span { display:flex; align-items:center; gap:5px }
.calendar-note { font-size:12px }
@media (max-width:389px) {
  .calendar { padding-inline:8px }
  main { padding-inline:10px }
}
dialog { position:fixed; inset:auto 0 0; width:min(430px,100%); max-width:100%; max-height:90dvh; border:0; border-radius:24px 24px 0 0; padding:24px 16px max(24px,env(safe-area-inset-bottom)); color:var(--ink); box-shadow:0 -12px 50px #0002 }
dialog::backdrop { background:#1b21196b; backdrop-filter:blur(3px) }
.sheet-title,.doc-entry,.kv { display:flex; align-items:center; justify-content:space-between; gap:10px }
.sheet-title h2 { font-size:20px }
.reservation-item,.kv { padding:10px 0; border-bottom:1px solid var(--line) }
.kv b { text-align:right; font-variant-numeric:tabular-nums }
.field { margin-bottom:16px }
.field label { display:block; font-weight:700; margin-bottom:8px }
.field input,.field textarea,.field select { display:block; width:100%; min-width:0; min-height:48px; padding:10px 12px; border:1px solid var(--bark); border-radius:10px; background:#fff }
.field textarea { min-height:76px; resize:vertical }
.field input[aria-invalid] { border:2px solid var(--bark) }
.steps { display:flex; gap:5px; margin:0 0 16px }
.steps span { flex:1; height:4px; border-radius:9px; background:#dddcd3 }
.steps .on { background:var(--green) }
.switchrow { display:flex; gap:10px; align-items:center; min-height:48px }
.switchrow input { width:24px; height:24px; accent-color:var(--green) }
.alert,.hint { margin:12px 0; padding:12px; border-radius:12px; background:#f9e9e4; color:#782d23 }
.hint { background:#eef0e6; color:var(--green) }
.error-text { color:#782d23; font-size:14px }
.preview { width:100%; height:min(60dvh,640px); border:1px solid var(--line); border-radius:9px }
.mark.bloqueada { background:var(--cream); border-color:var(--bark); width:auto; height:auto; font-size:10px; line-height:1.2 }
.cine-mark { font-size:11px; background:#f8e6cb; color:var(--green); border-radius:5px; padding-inline:4px }
.day[aria-pressed="true"] { border:2px solid var(--green); background:#eef0e6 }
.day { gap:4px }
.lock-form { max-width:390px; margin:auto; border-radius:16px; inset:0 }
.field input:disabled { background:#f4efe5; border-color:var(--line) }
.aviso + .aviso { border-top:1px solid var(--line); margin-top:8px; padding-top:8px }
.status { text-align:center; padding:32px 16px }
.success-icon { font-size:38px; color:var(--green) }
.doc-entry { flex-wrap:wrap; border:1px solid var(--line); border-radius:13px; padding:12px; margin:10px 0; overflow-wrap:anywhere }
.pill { background:var(--cream); color:var(--green); border-radius:100px; padding:5px 10px; font-size:14px; font-weight:700 }
.signed { background:#dcebdc }
.doc-entry [role="alert"], .doc-entry [role="status"] { flex-basis:100% }
fieldset { margin:0 0 16px; min-width:0; border:1px solid var(--line); border-radius:12px }
</style>
</head>

<script>
"use strict";

const app = document.querySelector("#app");
const nav = document.querySelector("nav");
const sheet = document.querySelector("#day-sheet");
const injected = window.CJ_API;
const hour = 60 * 60000;
const localNow = () => new Date(Date.now() - 6 * hour).toISOString();
const iso = date => date.toISOString().slice(0, 10);
const fromIso = date => new Date(date + "T00:00:00Z");
const dayAfter = date => iso(new Date(+fromIso(date) + 24 * hour));
const minutes = (date, time) => Date.parse(date + "T" + time + ":00Z") / 60000 + 360;
const localMinute = n => new Date((n - 360) * 60000).toISOString();
const shortDate = date => date.split("-").reverse().join("/");
const dateTime = n => Number.isFinite(n) ? shortDate(localMinute(n).slice(0, 10)) + " · " + localMinute(n).slice(11, 16) : "Sin fecha";
const monthName = new Intl.DateTimeFormat("es-MX", { month:"long", timeZone:"UTC" });
const monthHeading = date => monthName.format(date).replace(/^./, letter => letter.toUpperCase()) + " " + date.getUTCFullYear();
const money = cents => new Intl.NumberFormat("en-US", { style:"currency", currency:"USD" }).format(cents / 100) + " MXN";
const cents = value => Math.round(Number(value) * 100);
const escape = value => String(value ?? "").replace(/[&<>"']/g, char => ({
  "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
})[char]);
const requestId = () => Array.from(crypto.getRandomValues(new Uint8Array(16)), byte => byte.toString(16).padStart(2, "0")).join("");
const cabins = { "Caimán":"CAI", "Mariposa":"MAR", "Ambas":"AMB" };
const platforms = { AIRBNB:"Airbnb", BOOKING:"Booking", OTRA:"Otra" };
const nightStatus = { EMITIDO:"apartada", FIRMADO:"apartada", VENCIDO:"apartada", PLATAFORMA:"plataforma", BLOQUEADO:"bloqueada" };
const treatments = { "Sr.":"Sr.", "Sra.":"Sra.", "Srta.":"Srta." };
const cabinLabels = { CAI:"Caimán", MAR:"Mariposa", AMB:"Ambas" };
const alertMarkup = '<p class="alert" role="alert" hidden></p>';

let token;
let month = fromIso(localNow().slice(0, 7) + "-01");
let draft;
let step = 0;
let searchTimer;
let rangeStart;
let previewUrl;

async function call(action, data) {
  if (!injected && !token) return { ok:false, code:"UNAUTHENTICATED" };
  try {
    const result = injected ? await injected.llamar(action, data) : await fetch(CJ_CONFIG.API_URL, {
      method:"POST",
      headers:{ "Content-Type":"text/plain;charset=utf-8" },
      body:JSON.stringify({ accion:action, datos:data, id_token:token })
    }).then(response => response.json());
    if (!result || typeof result.ok !== "boolean") return { ok:false, code:"RESPUESTA_INVALIDA" };
    if (result.code === "UNAUTHENTICATED" && !injected) {
      token = null;
      document.querySelector("#signin").hidden = false;
    }
    return result;
  } catch {
    return { ok:false, code:"RED" };
  }
}

function message(result) {
  if (result.code === "DATOS_INCOMPLETOS") {
    return "Faltan datos: " + [...(result.faltantes || []), ...(result.bloqueos || [])].join(", ");
  }
  if (result.code === "DATOS_INVALIDOS" && result.error) return result.error;
  return ({
    FECHAS_OCUPADAS:"Esas noches ya están apartadas",
    ANTICIPO_REQUERIDO:"Registra el anticipo recibido",
    NO_ES_PDF:"Elige un documento en formato PDF.",
    YA_FIRMADO:"El documento ya tiene un firmado. Vuelve a abrir el expediente.",
    DOCUMENTO_NO_EXISTE:"No encontramos el documento en esta reserva. Vuelve a abrir el expediente.",
    NOT_FOUND:"No encontramos la reserva o el documento.",
    UNAUTHENTICATED:"Inicia sesión de nuevo para continuar.",
    RED:"Se perdió la conexión. Si estabas guardando, consulta la reserva antes de reintentar."
  })[result.code] || "No se pudo completar la solicitud. Intenta de nuevo.";
}

function heading(title, subtitle = "") {
  return '<div class="heading"><h2 tabindex="-1">' + escape(title) + "</h2>" +
    (subtitle ? '<p class="sub">' + escape(subtitle) + "</p>" : "") + "</div>";
}

function screen(html, focus = true) {
  if (previewUrl) {
    URL.revokeObjectURL(previewUrl);
    previewUrl = null;
  }
  const view = document.createElement("div");
  view.innerHTML = html;
  app.replaceChildren(view);
  window.scrollTo(0, 0);
  if (focus) view.querySelector("h2")?.focus({ preventScroll:true });
  return view;
}

function alertText(target, text) {
  target.hidden = !text;
  target.textContent = text;
}

function monthRange() {
  return {
    desde_min:minutes(iso(month), "00:00"),
    hasta_min:minutes(iso(new Date(Date.UTC(month.getUTCFullYear(), month.getUTCMonth() + 1, 1))), "00:00")
  };
}

function navigate(section, focus = true, notice) {
  rangeStart = null;
  for (const button of nav.querySelectorAll("button")) {
    if (button.dataset.section === section) button.setAttribute("aria-current", "page");
    else button.removeAttribute("aria-current");
  }
  if (section === "calendar") calendar(focus);
  if (section === "new") {
    if (!draft) startDraft();
    reservation();
  }
  if (section === "docs") documents(notice);
}

async function calendar(focus = true) {
  const range = monthRange();
  const view = screen(heading("Disponibilidad", "Toca una fecha para registrar o consultar una reserva.") +
    '<section class="card calendar"><div class="calendar-head">' +
    '<button type="button" class="iconbtn" aria-label="Mes anterior">‹</button>' +
    '<h3>' + monthHeading(month) + '</h3><button type="button" class="btn secondary">Hoy</button>' +
    '<button type="button" class="iconbtn" aria-label="Mes siguiente">›</button></div>' +
    '<div class="weekdays" aria-hidden="true">' + [..."DLMMJVS"].map(day => "<span>" + day + "</span>").join("") + '</div>' +
    '<p class="hint range-tip" role="status" hidden></p>' +
    '<div class="month-grid" aria-busy="true"></div><p class="sub" role="status" hidden></p>' +
    '<p class="alert" role="alert" hidden></p>' +
    '<div class="legend"><span><i class="mark apartada caiman"></i>Caimán</span><span><i class="mark apartada mariposa"></i>Mariposa</span></div>' +
    '<div class="legend"><span><i class="mark libre"></i>Libre</span><span><i class="mark apartada caiman"></i>Apartada</span><span><i class="mark plataforma caiman"></i>Plataforma</span><span>🔒 Bloqueada</span><span class="cine-mark">🎬 Cine</span></div>' +
    '<p class="sub calendar-note">Izquierda: Caimán · derecha: Mariposa.</p></section><section class="card firma-avisos" hidden></section>' +
    '<section class="card signed-avisos" aria-labelledby="signed-notices-title" hidden></section>', focus);
  loadNotices(view);
  const grid = view.querySelector(".month-grid");
  const status = grid.nextElementSibling;
  const rangeTip = view.querySelector(".range-tip");
  if (rangeStart) {
    alertText(rangeTip, "Selecciona el último día del bloqueo. Inicio: " + shortDate(rangeStart));
    const cancel = document.createElement("button");
    cancel.className = "link";
    cancel.textContent = "Cancelar selección";
    cancel.onclick = () => { rangeStart = null; calendar(); };
    rangeTip.after(cancel);
  }
  const header = view.querySelector(".calendar-head");
  [...header.querySelectorAll("button")].forEach((button, i) => {
    button.onclick = () => {
      month = i === 1 ? fromIso(localNow().slice(0, 7) + "-01")
        : new Date(Date.UTC(month.getUTCFullYear(), month.getUTCMonth() + i - 1, 1));
      calendar(false);
      app.querySelectorAll(".calendar-head button")[i].focus({ preventScroll:true });
    };
  });
  const loading = setTimeout(() => {
    status.hidden = false;
    status.textContent = "Cargando reservas del mes…";
  }, 1000);
  const result = await call("calendario.rango", range);
  clearTimeout(loading);
  if (!view.isConnected) return;
  status.hidden = true;
  grid.setAttribute("aria-busy", "false");
  if (!result.ok) {
    alertText(view.querySelector('[role="alert"]'), message(result));
    const retry = document.createElement("button");
    retry.className = "btn secondary";
    retry.textContent = "Reintentar";
    retry.onclick = () => calendar();
    grid.after(retry);
    return;
  }
  grid.innerHTML = "<span></span>".repeat(month.getUTCDay());
  const names = ["Caimán", "Mariposa"];
  const resources = ["CAIMAN", "MARIPOSA"].map(resource =>
    result.recursos.find(entry => entry.recurso === resource)?.ocupaciones || []);
  const cinema = result.recursos.find(entry => entry.recurso === "CINE")?.ocupaciones || [];
  const today = localNow().slice(0, 10);
  for (let day = 1, start = range.desde_min; start < range.hasta_min; day++, start += 1440) {
    const date = localMinute(start).slice(0, 10);
    const dateLabel = day + " de " + monthName.format(month);
    const night = start + 18 * 60;
    const dayReservations = resources.map(list => list.filter(r =>
      nightStatus[r.estado] && r.entrada_min < start + 1440 && start < r.salida_min));
    const occupied = dayReservations.map(list => list.filter(r => r.entrada_min <= night && night < r.salida_min));
    const states = occupied.map(list => nightStatus[list[0]?.estado] || "libre");
    const movies = cinema.filter(r => r.entrada_min < start + 1440 && start < r.salida_min);
    const button = document.createElement("button");
    button.type = "button";
    button.className = "day" + (occupied.some(list => list.length) || movies.length ? " occupied" : "");
    button.setAttribute("aria-label", dateLabel + ": " + names.map((name, i) => name + " " + states[i]).join(", ") +
      (movies.length ? ", Cine apartado" : ""));
    if (date === today) button.setAttribute("aria-current", "date");
    if (rangeStart) button.setAttribute("aria-pressed", String(date === rangeStart));
    button.innerHTML = '<span class="num">' + day + '</span><span class="marks" aria-hidden="true">' +
      states.map((state, i) => '<i class="mark ' + (i ? "mariposa " : "caiman ") + state + '">' +
        (state === "bloqueada" ? "🔒" : "") + "</i>").join("") + '</span>' +
      (movies.length ? '<span class="cine-mark" aria-hidden="true">🎬</span>' : "");
    button.onclick = () => {
      if (rangeStart && (date < rangeStart || (fromIso(date) - fromIso(rangeStart)) / hour >= 92 * 24)) {
        alertText(view.querySelector('[role="alert"]'), "Elige un último día entre el inicio y un máximo de 92 noches.");
        return;
      }
      const reservations = [...new Map([...dayReservations.flat(), ...movies]
        .filter(r => r.estado !== "BLOQUEADO").map(r => [r.reserva, r])).values()];
      if (rangeStart) {
        const first = minutes(rangeStart, "18:00");
        const last = night;
        const conflicts = resources.map(list => list.filter(r => {
          const firstOccupied = first + Math.max(0, Math.ceil((r.entrada_min - first) / 1440)) * 1440;
          return r.estado !== "BLOQUEADO" && firstOccupied <= last && firstOccupied < r.salida_min;
        }));
        openDay(rangeStart, shortDate(rangeStart) + " — " + shortDate(date), [], conflicts, date);
      } else {
        openDay(date, dateLabel + " de " + month.getUTCFullYear(), reservations, occupied, "");
      }
    };
    grid.append(button);
  }
  grid.onkeydown = event => {
    const delta = { ArrowLeft:-1, ArrowRight:1, ArrowUp:-7, ArrowDown:7 }[event.key];
    if (!delta || !event.target.matches(".day")) return;
    event.preventDefault();
    grid.children[[...grid.children].indexOf(event.target) + delta]?.focus();
  };
}

async function loadNotices(view) {
  const result = await call("avisos");
  if (!view.isConnected) return;
  const list = view.querySelector(".firma-avisos");
  if (!result.ok) {
    list.hidden = false;
    list.innerHTML = alertMarkup + '<button class="link">Reintentar</button>';
    alertText(list.querySelector('[role="alert"]'), message(result));
    list.querySelector("button").onclick = () => loadNotices(view);
    return;
  }
  const pending = result.avisos.filter(notice => notice.estado !== "FALTA_FIRMADO");
  const unsigned = result.avisos.filter(notice => notice.estado === "FALTA_FIRMADO");
  const signedList = view.querySelector(".signed-avisos");
  signedList.hidden = !unsigned.length;
  if (unsigned.length) {
    const render = expanded => {
      signedList.innerHTML = '<h3 id="signed-notices-title">Firmados por subir</h3>' +
        (expanded ? unsigned : unsigned.slice(0, 5)).map((notice, i) =>
          '<div class="aviso"><strong>' + escape(notice.documento + " · " + notice.titular) +
          '</strong><p class="sub">' + escape(notice.aviso) +
          '</p><button class="btn secondary" data-upload-notice="' + i + '" aria-label="Subir firmado ' +
          escape(notice.documento) + '">Subir firmado</button></div>').join("") +
        (!expanded && unsigned.length > 5 ? '<button class="link" data-show-all>Ver todos (' + unsigned.length + ')</button>' : "");
      signedList.querySelectorAll("[data-upload-notice]").forEach(button => {
        button.onclick = () => navigate("docs", true, unsigned[button.dataset.uploadNotice]);
      });
      const more = signedList.querySelector("[data-show-all]");
      if (more) more.onclick = () => {
        render(true);
        signedList.querySelectorAll("[data-upload-notice]")[5].focus();
      };
    };
    render(false);
  }
  list.hidden = !pending.length;
  if (list.hidden) return;
  list.innerHTML = '<h3>Pendientes de firma</h3>' + pending.map((notice, i) =>
    '<div class="aviso"><button class="link" data-notice="' + i + '">' + escape(notice.reserva + " · " + notice.titular) +
    '</button><p class="sub">' + escape(notice.aviso) + '</p>' + (notice.estado === "VENCIDO"
      ? '<button class="btn secondary" data-refund="' + i + '">Ofrecer reembolso</button>' : "") + '</div>').join("");
  list.querySelectorAll("[data-notice]").forEach(button => {
    button.onclick = () => detail(pending[button.dataset.notice].reserva);
  });
  list.querySelectorAll("[data-refund]").forEach(button => {
    button.onclick = () => detail(pending[button.dataset.refund].reserva, true);
  });
}

function openDay(date, title, reservations, occupied, until) {
  sheet.innerHTML = '<div class="sheet-title"><h2 id="day-title">' + escape(title) +
    '</h2><button class="iconbtn" aria-label="Cerrar">×</button></div>' +
    reservations.map(r => '<div class="reservation-item"><strong>' + escape(r.titular) +
      '</strong><div class="sub">' + (r.codigo === "CIN" ? "🎬 Cine" : escape(nightStatus[r.estado])) +
      '</div><button class="link" data-reservation>Ver reserva ' + escape(r.reserva) + '</button></div>').join("") +
    ["CAI", "MAR"].map((code, i) => {
      const r = occupied[i][0];
      const blocked = r?.estado === "BLOQUEADO";
      return '<label class="switchrow"><input type="checkbox" role="switch" data-cabin="' + code +
        '"' + (r ? blocked ? "" : " disabled" : " checked") + '>' + cabinLabels[code] + " · " +
        (blocked ? "🔒 Bloqueada" : r ? "Reservada · " + escape(r.reserva) : "Disponible") + '</label>';
    }).join("") +
    (until ? "" : '<button class="link" id="range-select">Seleccionar varios días</button><p><button class="btn full" id="book-day">Reservar</button></p>');
  const close = sheet.querySelector(".iconbtn");
  if (!sheet.open) sheet.showModal();
  close.focus();
  close.onclick = () => sheet.close();
  sheet.querySelectorAll("[data-reservation]").forEach((button, i) => {
    button.onclick = () => {
      sheet.close();
      detail(reservations[i].reserva);
    };
  });
  sheet.querySelectorAll("[data-cabin]").forEach((control, i) => {
    control.onchange = () => editBlock(date, until, control.dataset.cabin, until ? null : occupied[i][0],
      () => {
        openDay(date, title, reservations, occupied, until);
        sheet.querySelectorAll("[data-cabin]")[i].focus();
      });
  });
  if (until) return;
  sheet.querySelector("#range-select").onclick = () => {
    rangeStart = date;
    sheet.close();
    calendar();
  };
  sheet.querySelector("#book-day").onclick = () => {
    sheet.close();
    startDraft(date);
    navigate("new");
  };
}

function editBlock(desde, end, cabana, blocked, back) {
  const reasons = { PERSONAL:"Personal", MANTENIMIENTO:"Mantenimiento", OTRO:"Otro" };
  let last = "PERSONAL";
  try { last = localStorage.getItem("cj-motivo-bloqueo") || last; } catch {}
  const title = blocked ? "Quitar bloqueo" : "Bloquear noches";
  const modal = document.createElement("dialog");
  modal.className = "lock-form";
  modal.setAttribute("aria-labelledby", "block-title");
  const first = blocked ? localMinute(blocked.entrada_min).slice(0, 10) : desde;
  const lastNight = blocked ? localMinute(blocked.salida_min - 1440).slice(0, 10) : end;
  modal.innerHTML = '<form><h2 id="block-title">' + title + '</h2><p>' + cabinLabels[cabana] + ' · ' + shortDate(first) +
    (lastNight && lastNight !== first ? " — " + shortDate(lastNight) : "") + '</p>' + (blocked
      ? '<p>¿Confirmas que estas noches vuelven a estar disponibles?</p>'
      : field("motivo", "Motivo", { value:last, choices:reasons }) +
        field("nota", "Nota (opcional)", { value:"", type:"textarea", attrs:'maxlength="300"' }) +
        field("hasta", "Hasta (opcional)", { value:end, type:"date", attrs:'min="' + desde + '" max="' +
          iso(new Date(+fromIso(desde) + 91 * 24 * hour)) + '"' })) + alertMarkup +
    '<div class="buttons"><button type="button" class="btn secondary" autofocus>Cancelar</button><button class="btn">' +
    (blocked ? title : "Bloquear") + '</button></div></form>';
  document.body.append(modal);
  modal.onclose = () => {
    modal.remove();
    if (sheet.open) back();
  };
  modal.showModal();
  modal.onclick = event => {
    if (event.target === modal && !saving) {
      const box = modal.getBoundingClientRect();
      if (event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom) modal.close();
    }
  };
  modal.querySelector('[type="button"]').onclick = () => modal.close();
  const form = modal.querySelector("form");
  let saving = false;
  modal.oncancel = event => { if (saving) event.preventDefault(); };
  form.onsubmit = async event => {
    event.preventDefault();
    if (saving) return;
    const { hasta, motivo, nota } = form.elements;
    const payload = blocked ? { bloqueo:blocked.reserva, confirmar:true }
      : { request_id:requestId(), cabana, desde, hasta:hasta.value || desde, motivo:motivo.value, nota:nota.value.trim() };
    saving = true;
    const buttons = [...form.querySelectorAll("button")];
    buttons.forEach(button => { button.disabled = true; });
    const result = await call(blocked ? "bloqueo.quitar" : "bloqueo.crear", payload);
    saving = false;
    buttons.forEach(button => { button.disabled = false; });
    if (!result.ok) return alertText(form.querySelector('[role="alert"]'), result.code === "FECHAS_OCUPADAS"
      ? "Esas noches ya están apartadas" + (result.reserva ? " (" + result.reserva + ")" : "") : message(result));
    if (!blocked) {
      try { localStorage.setItem("cj-motivo-bloqueo", payload.motivo); } catch {}
    }
    sheet.close();
    modal.close();
    rangeStart = null;
    calendar();
  };
}

sheet.addEventListener("click", event => {
  if (event.target === sheet && event.clientY < sheet.getBoundingClientRect().top) sheet.close();
});

function startDraft(date = "") {
  draft = {
    origin:"DIRECTA", cabana:"Caimán", fechaEntrada:date, fechaSalida:date ? dayAfter(date) : "",
    horaEntrada:"14:00", horaSalida:"12:00", tratamiento:"Sr.", huespedesCaiman:"", huespedesMariposa:"",
    autorizacion:false, horasExtra:"0", costoHoraExtra:"0", personasExtra:"0", costoPersonaExtra:"0",
    formaPago:"Transferencia", plataforma:"AIRBNB", pendientes:[]
  };
  step = 0;
}

function field(name, label, options = {}) {
  const value = options.value ?? draft?.[name] ?? "";
  const attrs = options.attrs || "";
  const id = escape(name);
  const input = options.choices
    ? '<select id="' + id + '" name="' + id + '" ' + attrs + ">" + Object.entries(options.choices)
      .map(([key, text]) => '<option value="' + escape(key) + '"' + (key === value ? " selected" : "") + ">" + escape(text) + "</option>").join("") + "</select>"
    : options.type === "textarea"
      ? '<textarea id="' + id + '" name="' + id + '" ' + attrs + ">" + escape(value) + "</textarea>"
      : '<input id="' + id + '" name="' + id + '" type="' + (options.type || "text") + '" value="' + escape(value) + '" ' + attrs + ">";
  return '<div class="field"><label for="' + id + '">' + label + "</label>" + input + "</div>";
}

const number = (name, label, min = 0, increment = "0.01", extra = "") =>
  field(name, label, { type:"number", attrs:'required min="' + min + '" step="' + increment + '" ' + extra });
const dateField = (name, label) => field(name, label, { type:"date", attrs:"required" });
const timeField = (name, label) => field(name, label, { type:"time", attrs:"required" });
const total = () => cents(draft.rentaBase || 0) + Number(draft.horasExtra) * cents(draft.costoHoraExtra)
  + Number(draft.personasExtra) * cents(draft.costoPersonaExtra);
const scheduled = () => cents(draft.anticipo || 0) + draft.pendientes.reduce((sum, payment) => sum + cents(payment.importe), 0);

function pdfFile(file) {
  return new File([Uint8Array.from(atob(file.pdf_base64), char => char.charCodeAt(0))], file.nombre, { type:"application/pdf" });
}

function download(url, name) {
  const link = document.createElement("a");
  link.href = url;
  link.download = name;
  link.click();
}

async function preview(payload, back, summary = "") {
  const stay = payload.clave.startsWith("HOSPEDAJE_");
  const view = screen(heading("Vista previa") + (stay
    ? '<div class="steps" role="img" aria-label="Paso 4 de 4">' + '<span class="on"></span>'.repeat(4) + '</div>'
    : "") + '<section class="card">' + (stay ? '<h3>Vista previa del contrato</h3>' : "") + summary +
    '<p class="hint">El borrador no aparta fechas ni gasta folio</p>' +
    '<p role="status">Generando vista previa…</p>' + alertMarkup +
    '<iframe class="preview" title="PDF del borrador" hidden></iframe><div class="buttons">' +
    '<button class="btn secondary" id="share" disabled>Compartir borrador</button>' +
    '<button class="btn secondary" id="download" disabled>Descargar</button>' +
    '<button class="btn secondary" id="back">Atrás</button>' +
    '<button class="btn secondary" id="retry" hidden>Reintentar vista previa</button>' +
    '<button class="btn" id="emit" disabled>Emitir definitivo</button></div></section>');
  const status = view.querySelector('[role="status"]');
  const alert = view.querySelector('[role="alert"]');
  const previous = view.querySelector("#back");
  const retry = view.querySelector("#retry");
  const emit = view.querySelector("#emit");
  const share = view.querySelector("#share");
  const save = view.querySelector("#download");
  const showError = result => {
    alertText(alert, result.code === "FECHAS_OCUPADAS" ? "Esas fechas ya están apartadas" : message(result));
    alert.tabIndex = -1;
    alert.focus();
  };
  previous.onclick = back;
  retry.onclick = () => preview(payload, back, summary);
  let result = await call("documento.vista_previa", payload);
  if (!view.isConnected) return;
  if (result.ok) result = await call("documento.descargar", { file_id:result.pdf_id });
  if (!view.isConnected) return;
  status.hidden = true;
  let file;
  try {
    if (result.ok && result.pdf_base64) file = pdfFile(result);
  } catch {}
  if (!file) {
    retry.hidden = false;
    showError(result);
    return;
  }
  const url = previewUrl = URL.createObjectURL(file);
  const frame = view.querySelector("iframe");
  frame.src = url;
  frame.hidden = false;
  emit.disabled = share.disabled = save.disabled = false;
  save.onclick = () => download(url, file.name);
  share.onclick = async () => {
    const data = { files:[file] };
    try {
      if (navigator.share && (!navigator.canShare || navigator.canShare(data))) await navigator.share(data);
      else save.onclick();
    } catch (error) {
      if (error.name !== "AbortError" && view.isConnected) save.onclick();
    }
  };
  emit.onclick = async () => {
    if (emit.disabled) return;
    emit.disabled = previous.disabled = nav.inert = true;
    alertText(alert, "");
    alertText(status, "Emitiendo el documento…");
    const result = await call(stay ? "hospedaje.emitir" : "documento.emitir", {
      ...(stay ? { datos:payload.datos } : payload), request_id:requestId()
    });
    nav.inert = false;
    if (!view.isConnected) return;
    status.hidden = true;
    if (!result.ok) {
      emit.disabled = previous.disabled = false;
      showError(result);
      return;
    }
    const date = payload.datos.nuevo?.fechaEntrada || payload.datos.nuevo?.fechaServicio ||
      payload.datos.fechaEntrada || payload.datos.fechaServicio;
    if (date) month = fromIso(date.slice(0, 7) + "-01");
    if (stay || payload.clave === "CINE_PARCIAL") startDraft();
    const done = screen(heading(stay ? "Contrato emitido" : "Documento emitido") +
      '<section class="card status"><div class="success-icon" aria-hidden="true">✓</div><h3>' + escape(result.folio) +
      '</h3><div class="buttons"><button class="btn">Ver reserva</button>' +
      '<button class="btn secondary">Ver en calendario</button></div></section>');
    done.querySelector(".btn").onclick = () => detail(result.reserva);
    done.querySelector(".secondary").onclick = () => navigate("calendar");
  };
}

function previewStay() {
  const d = draft;
  const data = {};
  for (const key of ["cabana", "tratamiento", "nombre", "domicilioTitular", "fechaEntrada", "horaEntrada",
    "fechaSalida", "horaSalida", "huespedesCaiman", "huespedesMariposa", "rentaBase", "horasExtra",
    "costoHoraExtra", "personasExtra", "costoPersonaExtra", "fechaFirma", "horaFirma", "fechaLimiteSaldo"]) {
    data[key] = d[key]?.trim() || "";
  }
  data.genero = d.tratamiento === "Sr." ? "M" : "F";
  if (d.cabana === "Caimán") data.huespedesMariposa = "";
  if (d.cabana === "Mariposa") data.huespedesCaiman = "";
  if (Number(data.huespedesCaiman) > 14) data.autorizacionCaiman = d.autorizacion;
  if (Number(data.huespedesMariposa) > 10) data.autorizacionMariposa = d.autorizacion;
  data.pagos = [{
    importe:d.anticipo, estado:"recibido", fechaPactada:d.fechaAnticipo,
    fechaRecepcion:d.fechaAnticipo, formaPago:d.formaPago
  }, ...d.pendientes.map(payment => ({ ...payment, estado:"pendiente" }))];
  preview({ clave:"HOSPEDAJE_" + cabins[d.cabana], datos:data }, reservation,
    '<p><strong>Saldo: ' + money(total() - scheduled()) + '</strong></p>');
}

function reservation(focus = true) {
  const platform = draft.origin === "PLATAFORMA";
  const titles = ["Datos", "Importe de la estancia", "Pagos", "Vista previa"];
  let fields;
  if (platform) {
    fields = field("plataforma", "Plataforma", { choices:platforms }) +
      field("identificador", "Identificador de la reserva", { attrs:'required maxlength="40" pattern="[A-Za-z0-9\\-]{3,40}"' }) +
      stayFields() + number("importe_bruto", "Importe bruto (MXN)", "0.01") + number("importe_neto", "Importe neto (MXN)") +
      field("nota", "Nota (opcional)", { type:"textarea", attrs:'maxlength="500"' });
  } else if (step === 0) {
    fields = stayFields() + '<div id="guests">' + guestFields() + "</div>" +
      field("tratamiento", "Tratamiento", { choices:treatments }) +
      field("nombre", "Nombre completo", { attrs:'required maxlength="300" autocomplete="name"' }) +
      field("domicilioTitular", "Domicilio (opcional)", { type:"textarea", attrs:'maxlength="300" autocomplete="street-address"' });
  } else if (step === 1) {
    fields = number("rentaBase", "Renta base (MXN)") + number("horasExtra", "Horas extra", 0, 1) +
      number("costoHoraExtra", "Costo por hora extra (MXN)") + number("personasExtra", "Personas extra", 0, 1) +
      number("costoPersonaExtra", "Costo por persona extra (MXN)") + '<p class="hint" id="total">Total: ' + money(total()) + "</p>";
  } else {
    fields = paymentsFields();
  }
  const view = screen(heading("Nueva reserva") +
    (step === 0 || platform ? '<div class="card">' +
      field("origin", "Origen del hospedaje", { choices:{ DIRECTA:"Reserva directa", PLATAFORMA:"Airbnb / plataforma" } }) +
      '<button type="button" class="btn secondary full" id="partial-cinema">Cine con estancia parcial</button></div>' : "") +
    (platform ? "" : '<div class="steps" role="img" aria-label="Paso ' + (step + 1) + ' de 4">' +
      titles.map((_, i) => '<span class="' + (i <= step ? "on" : "") + '"></span>').join("") + "</div>") +
    '<form class="card" novalidate>' + (platform ? "" : '<h3 tabindex="-1">' + titles[step] + '</h3>') + fields +
    '<p class="alert" role="alert" hidden></p><div class="buttons">' +
    (!platform && step > 0 ? '<button type="button" class="btn secondary" id="back">Volver</button>' : "") +
    '<button type="submit" class="btn">' + (platform ? "Guardar reserva de plataforma" : "Continuar") +
    '</button></div></form><p class="hint" role="status" hidden></p>', focus && step === 0);
  if (focus && step > 0) view.querySelector("h3").focus({ preventScroll:true });
  const form = view.querySelector("form");
  const origin = view.querySelector("#origin");
  if (origin) origin.onchange = () => {
    draft.origin = origin.value;
    step = 0;
    reservation(false);
    app.querySelector("#origin").focus({ preventScroll:true });
  };
  const partial = view.querySelector("#partial-cinema");
  if (partial) partial.onclick = () => manage("CINE_PARCIAL", "Cine con estancia parcial");
  if (!platform && step === 0) updateGuests(view);
  form.oninput = event => {
    const input = event.target;
    if (!input.name) return;
    if (input.name.includes("-")) {
      const [key, index] = input.name.split("-");
      draft.pendientes[index][key] = input.value;
    } else {
      draft[input.name] = input.type === "checkbox" ? input.checked : input.value;
    }
    clearFieldError(input);
    alertText(form.querySelector('[role="alert"]'), "");
    if (platform || step === 0) {
      if (input.name === "fechaEntrada") {
        const salida = form.elements.fechaSalida;
        if (input.value && (!salida.value || salida.value <= input.value)) {
          salida.value = draft.fechaSalida = dayAfter(input.value);
          clearFieldError(salida);
        }
      }
      if (!platform) {
        if (input.name === "cabana") view.querySelector("#guests").innerHTML = guestFields();
        updateGuests(view);
      }
    }
    if (!platform && step === 1) view.querySelector("#total").textContent = "Total: " + money(total());
  };
  const back = view.querySelector("#back");
  if (back) back.onclick = () => { step--; reservation(); };
  const add = view.querySelector("#add-payment");
  if (add) {
    add.onclick = () => {
      draft.pendientes.push({ importe:"", fechaPactada:"" });
      reservation(false);
      document.getElementById("importe-" + (draft.pendientes.length - 1)).focus();
    };
    view.querySelectorAll("[data-remove]").forEach(button => {
      button.onclick = () => {
        draft.pendientes.splice(Number(button.dataset.remove), 1);
        reservation(false);
        app.querySelector("#add-payment").focus();
      };
    });
  }
  form.onsubmit = event => {
    event.preventDefault();
    if (!validateReservation(form, platform)) return;
    if (platform) {
      savePlatform(form);
    } else if (step === 2) {
      previewStay();
    } else {
      if (step === 1 && !draft.fechaFirma) {
        const now = localNow();
        draft.fechaFirma = now.slice(0, 10);
        draft.horaFirma = now.slice(11, 16);
        draft.fechaAnticipo = draft.fechaFirma;
      }
      if (step === 0 && (!draft.fechaLimiteSaldo || draft.fechaLimiteSaldo === draft.previousEntry)) {
        draft.fechaLimiteSaldo = draft.fechaEntrada;
      }
      draft.previousEntry = draft.fechaEntrada;
      step++;
      reservation();
    }
  };
}

function clearFieldError(input) {
  if (!input.hasAttribute("aria-invalid")) return;
  input.removeAttribute("aria-invalid");
  input.removeAttribute("aria-describedby");
  input.nextElementSibling.remove();
}

function fieldError(input, text) {
  clearFieldError(input);
  const error = document.createElement("p");
  error.id = input.id + "-error";
  error.className = "error-text";
  error.textContent = text;
  input.after(error);
  input.setAttribute("aria-invalid", "true");
  input.setAttribute("aria-describedby", error.id);
  input.focus();
  return false;
}

function validateFields(form) {
  for (const input of form.querySelectorAll("input,textarea,select")) {
    if (input.disabled) continue;
    clearFieldError(input);
    if (input.validity.valueMissing || (input.required && !input.value.trim())) {
      return fieldError(input, "Completa " + input.labels[0].textContent.toLowerCase() + ".");
    }
    const numeric = input.type === "number";
    const format = input.step === "1" ? /^\d+$/ : /^\d+(\.\d{1,2})?$/;
    if (!input.validity.valid || (numeric && input.value && (!format.test(input.value) || !Number.isSafeInteger(cents(input.value))))) {
      const text = input.name === "identificador" ? "Usa de 3 a 40 letras, números o guiones."
        : input.type === "number" ? "Escribe un número válido para " + input.labels[0].textContent.toLowerCase() + "."
        : "Revisa el valor de " + input.labels[0].textContent.toLowerCase() + ".";
      return fieldError(input, text);
    }
  }
  return true;
}

function validateReservation(form, platform) {
  const fields = form.elements;
  const alert = form.querySelector('[role="alert"]');
  alertText(alert, "");
  if (!validateFields(form)) return false;
  const { fechaEntrada, horaEntrada, fechaSalida, horaSalida } = draft;
  if ((platform || step === 0) && minutes(fechaSalida, horaSalida) <= minutes(fechaEntrada, horaEntrada)) {
    return fieldError(fields.fechaSalida, "La salida debe ser posterior a la entrada.");
  }
  if (platform && cents(draft.importe_neto) > cents(draft.importe_bruto)) {
    const text = "El neto no puede ser mayor que el bruto";
    alertText(alert, text);
    return fieldError(fields.importe_neto, text);
  }
  if (!platform && step === 0) {
    for (const [cabin, key, normal, max] of [
      ["Caimán", "huespedesCaiman", 14, 16], ["Mariposa", "huespedesMariposa", 10, 12]
    ]) {
      if (fields[key] && Number(draft[key]) > max) return fieldError(fields[key], cabin + " admite hasta " + max + " personas.");
      if (needsAuthorization(cabin, key, normal) && !draft.autorizacion) return fieldError(fields[key], "Confirma la autorización para " + cabin + ".");
    }
  }
  if (!platform && step === 1 && total() <= 0) return fieldError(fields.rentaBase, "El total de la estancia debe ser mayor que cero.");
  if (!platform && step === 2) {
    if (draft.fechaAnticipo >= fechaEntrada || draft.fechaAnticipo > localNow().slice(0, 10)) {
      return fieldError(fields.fechaAnticipo, "Usa una fecha anterior a la entrada, hasta el día de hoy.");
    }
    const late = draft.pendientes.findIndex(payment => payment.fechaPactada >= fechaEntrada);
    if (late >= 0) return fieldError(fields["fechaPactada-" + late], "La fecha pactada debe ser anterior a la entrada.");
    if (scheduled() > total()) return fieldError(fields.anticipo, "El anticipo y los abonos no pueden superar el total.");
    if (draft.fechaLimiteSaldo > fechaEntrada) return fieldError(fields.fechaLimiteSaldo, "Usa la fecha de entrada o una anterior.");
  }
  return true;
}

async function savePlatform(form) {
  if (form.inert) return;
  form.inert = true;
  const origin = app.querySelector("#origin");
  if (origin) origin.disabled = true;
  nav.inert = true;
  const status = form.nextElementSibling;
  const wait = setTimeout(() => {
    status.textContent = "Apartando las noches…";
    status.hidden = false;
  }, 1000);
  const d = draft;
  const result = await call("reserva.plataforma", {
    request_id:requestId(), plataforma:d.plataforma, identificador:d.identificador.trim(), cabana:cabins[d.cabana],
    entrada_min:minutes(d.fechaEntrada, d.horaEntrada), salida_min:minutes(d.fechaSalida, d.horaSalida),
    importe_bruto:d.importe_bruto, importe_neto:d.importe_neto, nota:d.nota || ""
  });
  clearTimeout(wait);
  status.hidden = true;
  form.inert = false;
  if (origin) origin.disabled = false;
  nav.inert = false;
  if (!form.isConnected) return;
  if (!result.ok) {
    const text = result.code === "IDENTIFICADOR_REPETIDO"
      ? "Ese identificador de " + platforms[result.plataforma || d.plataforma] + " ya existe en " + result.reserva
      : message(result);
    const alert = form.querySelector('[role="alert"]');
    alertText(alert, text);
    alert.tabIndex = -1;
    alert.focus();
    return;
  }
  draft = null;
  month = fromIso(d.fechaEntrada.slice(0, 7) + "-01");
  const view = screen(heading("Reserva apartada") +
    '<div class="card status"><div class="success-icon" aria-hidden="true">✓</div><h3>' +
    escape(result.reserva) + '</h3>' +
    "<p>" + escape(platforms[result.plataforma || d.plataforma] + " · " + result.identificador) + "</p>" +
    '<button class="btn">Ver en calendario</button></div>');
  view.querySelector("button").onclick = () => navigate("calendar");
}

function documentRows(reservation, forSigning) {
  const docs = reservation.documentos || [];
  if (!docs.length) return '<p class="sub">La reserva aún no tiene documentos.</p>';
  const folios = [...new Set(docs.map(doc => doc.folio))];
  return folios.map((folio, i) => {
    const original = docs.find(doc => doc.folio === folio && !doc.tipo.endsWith("_FIRMADO"));
    const signed = docs.find(doc => doc.folio === folio && doc.tipo.endsWith("_FIRMADO"));
    const canSign = forSigning && original && !signed && (original === docs[0]
      ? ["EMITIDO", "VENCIDO"].includes(reservation.estado) || (reservation.origen === "LEGADO" && reservation.estado === "CANCELADO")
      : ["EMITIDO", "VENCIDO", "FIRMADO", "CANCELADO"].includes(reservation.estado));
    const links = [original, signed].filter((doc, index) =>
      doc?.pdf_id && doc.archivo !== "PENDIENTE_DE_SUBIR" && (index || doc.pdf_id !== signed?.pdf_id));
    return '<div class="doc-entry"><strong>' + escape(folio) + '</strong>' +
      '<span class="pill' + (signed ? ' signed">Firmado' : '">Falta firmado') + '</span>' +
      links.map(doc => '<button class="link" data-document="' + docs.indexOf(doc) + '">' +
        (links.length === 1 ? "Ver en Drive" : doc === signed ? "Ver firmado en Drive" : "Ver original en Drive") + '</button>').join("") +
      (canSign ? '<input type="file" accept=".pdf,application/pdf" hidden><button class="btn secondary" data-sign="' +
        docs.indexOf(original) + '" aria-label="Subir firmado ' + escape(folio) + '" aria-describedby="upload-status-' + i +
        ' upload-error-' + i + '">Subir firmado</button>' +
        '<p class="alert" id="upload-error-' + i + '" role="alert" hidden></p>' +
        '<p class="sub" id="upload-status-' + i + '" role="status" hidden></p>' : "") + '</div>';
  }).join("");
}

async function detail(folio, offerRefund = false) {
  const view = screen('<button class="link">‹ Volver al calendario</button>' + heading(folio) +
    '<div id="detail-content" aria-busy="true"></div><p class="sub" role="status" hidden></p><p class="alert" role="alert" hidden></p>');
  view.querySelector("button").onclick = () => navigate("calendar");
  const content = view.querySelector("#detail-content");
  const status = view.querySelector('[role="status"]');
  const alert = view.querySelector('[role="alert"]');
  const timer = setTimeout(() => alertText(status, "Cargando ficha…"), 1000);
  const result = await call("reserva.detalle", { reserva:folio });
  clearTimeout(timer);
  alertText(status, "");
  content.setAttribute("aria-busy", "false");
  if (!view.isConnected) return;
  if (!result.ok) return alertText(alert, message(result));
  const r = result.reserva;
  const payments = r.estado === "PLATAFORMA" ? [] : r.pagos || [];
  const received = payments.filter(p => p.estado === "RECIBIDO").reduce((sum, p) => sum + p.importe_cents, 0);
  const values = [
    ["Entrada", dateTime(r.entrada_min)], ["Salida", dateTime(r.salida_min)]
  ];
  if (r.estado === "PLATAFORMA") {
    if (Number.isSafeInteger(r.bruto_cents)) values.push(["Importe bruto", money(r.bruto_cents)]);
    if (Number.isSafeInteger(r.neto_cents)) values.push(["Importe neto", money(r.neto_cents)]);
  } else {
    const total = r.total_cents ?? 0;
    values.push(["Total", money(total)], ["Recibido", money(received)]);
    if (r.estado === "CANCELADO") {
      const refund = r.devolucion_cents ?? 0;
      if (refund > 0) values.push(["Devolución", money(refund)]);
      values.push(["Retenido", money(received - refund)], ["Estado", "Cancelada"]);
    } else {
      values.push(["Saldo", money(total - received)]);
    }
  }
  const active = ["EMITIDO", "FIRMADO", "VENCIDO"].includes(r.estado);
  const stay = r.documentos?.find(doc => doc.tipo === "CONTRATO");
  const services = (r.servicios || []).filter(service => service.estado === "EMITIDO");
  const actions = [
    ["CINE_ADICIONAL", "Agregar cine adicional", active && stay],
    ["CONVENIO_MODIFICACION", "Modificar hospedaje", active && stay],
    ["CONVENIO_CAMBIO_TITULAR", "Cambiar titular", active && stay],
    ["CANCELACION", "Cancelar", (active && stay) || services.length],
    ...services.flatMap(service => [
      ["CINE_CONVENIO_MODIFICACION", "Modificar cine", true, service],
      ["CINE_CONVENIO_CAMBIO_TITULAR", "Cambiar titular del cine", true, service]
    ])
  ];
  if (offerRefund && active && stay) return manage("CANCELACION", "Cancelar", r, null, true);
  content.innerHTML = '<section class="card"><h3>' + escape(r.titular || "Sin titular") + "</h3>" +
    values.map(([label, value]) => '<div class="kv"><span>' + label + "</span><b>" + value + "</b></div>").join("") +
    "</section>" + (payments.length ? '<section class="card"><h3>Abonos</h3>' + payments.map(payment => {
      const date = payment.fecha_iso ? escape(shortDate(payment.fecha_iso)) :
        r.origen === "LEGADO" ? "fecha no informada" : dateTime(payment.fecha_min);
      return '<div class="kv"><span>' + (payment.estado === "RECIBIDO" ? "Pago recibido" : "Pago programado") +
        "</span><b>" + money(payment.importe_cents) + " · " + date + "</b></div>";
    }).join("") + "</section>" : "") +
    '<section class="card"><h3>Documentos</h3>' + documentRows(r, false) +
    '</section><section class="card"><h3>Gestionar reserva</h3><div class="management">' +
    actions.map(([, label, enabled, service], i) =>
      '<button class="btn secondary" data-manage="' + i + '"' + (enabled ? "" : " disabled") + '>' + label +
      (service ? '<br><small>' + escape(service.folio) + '</small>' : "") + '</button>').join("") + '</div></section>';
  if (offerRefund) alertText(alert, "Esta reserva no tiene un contrato de hospedaje vigente.");
  content.querySelectorAll("[data-manage]").forEach(button => {
    const [key, label, , service] = actions[button.dataset.manage];
    button.onclick = () => manage(key, label, r, service);
  });
  documentLinks(content, r, alert);
}

function documentLinks(content, reservation, alert) {
  content.querySelectorAll("[data-document]").forEach(button => {
    button.onclick = async () => {
      button.disabled = true;
      alertText(alert, "");
      const file = await call("documento.descargar", { file_id:reservation.documentos[button.dataset.document].pdf_id });
      button.disabled = false;
      if (!button.isConnected) return;
      if (!file.ok) return alertText(alert, message(file));
      try {
        const url = URL.createObjectURL(pdfFile(file));
        download(url, file.nombre);
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      } catch {
        alertText(alert, "No se pudo abrir el PDF. Intenta de nuevo.");
      }
    };
  });
}

function manage(clave, title, r, service, offerRefund = false) {
  const cancel = clave === "CANCELACION";
  const partial = clave === "CINE_PARCIAL";
  const modify = clave.endsWith("_MODIFICACION");
  const changeHolder = clave.endsWith("_CAMBIO_TITULAR");
  const stay = r?.documentos?.find(doc => doc.tipo === "CONTRATO" && r.estado !== "CANCELADO");
  const activeServices = (r?.servicios || []).filter(item => item.estado === "EMITIDO");
  const text = (name, label, required = false) => field(name, label, {
    value:"", type:"textarea", attrs:required ? "required" : ""
  });
  const locked = (name, label, value) => field(name + "-original", label, { value, attrs:"disabled" });
  const cinemaFields = [
    ["fechaServicio", "Fecha del servicio", "date"],
    ["horaInicio", "Hora de inicio", "time"], ["horaFin", "Hora de fin", "time"],
    ["personas", "Personas", "number"], ["amenidades", "Amenidades", "textarea"],
    ["precio", "Precio (MXN)", "number"]
  ];
  const stayFields = [
    ["cabanas", "Cabaña", "select"], ["fechaEntrada", "Entrada", "date"], ["horaEntrada", "Hora de entrada", "time"],
    ["fechaSalida", "Salida", "date"], ["horaSalida", "Hora de salida", "time"],
    ["personas", "Personas", "number"], ["rentaTotal", "Renta total (MXN)", "number"]
  ];
  const editable = (name, label, type, value = "") => field(name, label, {
    value, type, attrs:type !== "number" ? "required" : name === "personas" ? 'required min="1" step="1"'
      : (["cargoModificacion", "saldoLiquidacion"].includes(name) ? "" : "required ") +
        'min="' + (name === "anticipo" ? "0.01" : "0") + '" step="0.01"',
    choices:type === "select" ? cabinLabels : undefined
  });
  const formatPesos = value => (value / 100).toFixed(2);
  const original = modify && (service ? { ...service.datos, fechaServicio:service.fechaServicio } : {
    ...r.datos, cabanas:r.codigo, rentaTotal:formatPesos(r.total_cents),
    fechaEntrada:r.datos?.fechaEntrada || localMinute(r.entrada_min).slice(0, 10),
    horaEntrada:r.datos?.horaEntrada || localMinute(r.entrada_min).slice(11, 16),
    fechaSalida:r.datos?.fechaSalida || localMinute(r.salida_min).slice(0, 10),
    horaSalida:r.datos?.horaSalida || localMinute(r.salida_min).slice(11, 16),
    personas:r.datos?.personas || ((Number(r.datos?.huespedesCaiman || 0) + Number(r.datos?.huespedesMariposa || 0)) || "")
  });
  const conditions = service ? cinemaFields : stayFields;
  const today = localNow().slice(0, 10);
  let fields;
  if (modify) {
    fields = conditions.map(([name, label, type]) => locked(name, label + " original", name === "cabanas"
      ? cabinLabels[original[name]] : original[name] || "") + editable(name, label, type, original[name] ?? "")).join("") +
      editable("cargoModificacion", "Cargo de modificación (MXN)", "number", "0") +
      (service ? '' : editable("fechaPagoAjuste", "Fecha de pago del ajuste", "date", today) +
        '<p class="hint" role="status" hidden>El calendario se moverá: se liberan las noches anteriores y se apartan las nuevas</p>');
  } else if (changeHolder) {
    fields = locked("titular", "Titular saliente", service?.titular ?? r.titular) +
      field("tratamientoNuevo", "Tratamiento nuevo", { value:"Sr.", choices:treatments }) +
      editable("titularNuevo", "Nombre del nuevo titular", "text") + text("domicilioNuevo", "Domicilio nuevo (opcional)");
  } else if (cancel) {
    fields = '<fieldset><legend>Documentos afectados</legend>' + [stay, ...activeServices].filter(Boolean).map(doc =>
      '<label class="switchrow"><input type="checkbox" name="afectado" value="' + escape(doc.folio) + '"' +
      (offerRefund && doc === stay ? " checked" : "") + '>' + (doc === stay ? "Hospedaje" : "Cine") + ' · ' + escape(doc.folio) +
      '</label>').join("") + '</fieldset>' + locked("referencia", "Referencia de contratación", "") +
      '<p class="hint" data-release hidden></p><div data-refund-fields hidden>' +
      editable("fecha_aviso", "Fecha del aviso de cancelación", "date", today) +
      '<p class="hint" role="status"></p><button class="link" type="button" data-retry-refund hidden>Reintentar propuesta</button></div>' +
      text("motivo", "Motivo", true) + editable("devolucion", "Devolución (MXN)", "number") +
      '<p class="sub" data-adjusted hidden>Ajustado a mano</p>' + text("observaciones", "Observaciones") +
      text("reembolsosRealizados", "Reembolsos realizados") + text("reembolsosPendientes", "Reembolsos pendientes") +
      editable("saldoLiquidacion", "Saldo de liquidación (MXN)", "number", "0");
  } else {
    fields = '<p class="hint">El cine aparta el día completo</p>' + (partial
      ? field("tratamiento", "Tratamiento", { value:"Sr.", choices:treatments }) +
        editable("nombre", "Nombre completo", "text") + text("domicilioTitular", "Domicilio (opcional)") : "") +
      editable(...cinemaFields[0], partial ? draft.fechaEntrada || today : today) +
      (partial ? '<fieldset><legend>Acceso a las instalaciones</legend>' +
        editable("horaAccesoInicio", "Inicio de acceso", "time") + editable("horaAccesoFin", "Fin de acceso", "time") +
        '</fieldset>' : "") +
      '<fieldset><legend>Actividad</legend>' + cinemaFields.slice(1, 3).map(args => editable(...args)).join("") + '</fieldset>' +
      cinemaFields.slice(3, 5).map(args => editable(...args)).join("") + text("inventario", "Inventario", true) +
      editable(...cinemaFields[5]) + editable("anticipo", "Anticipo recibido (MXN)", "number") +
      text("condicionesPago", "Condiciones de pago (opcional)");
  }

  const view = screen(heading(title, service?.folio || r?.reserva) + '<form class="card" novalidate>' + fields + alertMarkup +
    '<div class="buttons"><button type="button" class="btn secondary">Atrás</button>' +
    '<button class="btn">Vista previa</button></div></form>');
  const form = view.querySelector("form");
  const alert = form.querySelector('[role="alert"]');
  const submit = form.querySelector(".btn:not(.secondary)");
  const back = form.querySelector(".secondary");
  back.onclick = () => partial ? reservation() : detail(r.reserva);
  const inputs = form.elements;
  const selection = [...form.querySelectorAll('[name="afectado"]')];
  const affected = () => selection.filter(input => input.checked).map(input => input.value);
  let proposal;
  let proposedDate;
  let generatedNote = "";
  let refundRequest = 0;
  function adjusted() {
    const changed = proposal != null && inputs.devolucion.value !== "" && cents(inputs.devolucion.value) !== proposal;
    form.querySelector("[data-adjusted]").hidden = !changed;
    const note = changed ? "Monto de devolución ajustado a mano; propuesta del sistema: " + money(proposal) + "." : "";
    if (inputs.observaciones.value === generatedNote) inputs.observaciones.value = note;
    generatedNote = note;
  }
  async function updateRefund() {
    const ids = affected();
    const lodging = !!stay && ids.includes(stay.folio);
    const cinema = ids.some(folio => folio !== stay?.folio);
    inputs["referencia-original"].value = lodging ? stay.folio : ids[0] || "";
    alertText(form.querySelector("[data-release]"), [
      lodging ? "Se liberarán las noches del hospedaje" : "", cinema ? "Se liberará el día de cine" : ""
    ].filter(Boolean).join(". "));
    form.querySelector("[data-refund-fields]").hidden = inputs.fecha_aviso.disabled = !lodging;
    const date = inputs.fecha_aviso.value;
    if (lodging && date === proposedDate && (proposal != null || submit.disabled)) return;
    const request = ++refundRequest;
    if (proposedDate != null) inputs.devolucion.value = "";
    proposal = undefined;
    proposedDate = lodging ? date : undefined;
    adjusted();
    const retry = form.querySelector("[data-retry-refund]");
    retry.hidden = true;
    submit.disabled = lodging && !!date;
    if (!lodging || !date) return;
    const status = form.querySelector('[role="status"]');
    alertText(status, "Calculando reembolso…");
    const result = await call("reembolso.propuesta", { reserva:r.reserva, fecha_aviso:date });
    if (!view.isConnected || request !== refundRequest) return;
    if (!result.ok) {
      alertText(status, "");
      alertText(alert, message(result));
      retry.hidden = false;
      return;
    }
    proposal = result.propuesta_cents;
    inputs.devolucion.value = formatPesos(proposal);
    adjusted();
    submit.disabled = false;
    alertText(status, "Reembolso propuesto: " + money(proposal) + " (" + result.porcentaje +
      " % de lo pagado, " + result.dias + " días antes de la entrada)");
  }

  form.oninput = ({ target }) => {
    clearFieldError(target);
    alertText(alert, "");
    if (modify && !service) {
      form.querySelector('[role="status"]').hidden = !["cabanas", "fechaEntrada", "fechaSalida"]
        .some(name => inputs[name].value !== original[name]);
    }
    if (cancel && target === inputs.devolucion) adjusted();
  };
  if (cancel) {
    selection.forEach(input => { input.onchange = updateRefund; });
    inputs.fecha_aviso.onchange = updateRefund;
    form.querySelector("[data-retry-refund]").onclick = () => {
      proposedDate = undefined;
      alertText(alert, "");
      updateRefund();
    };
    updateRefund();
  }
  form.onsubmit = event => {
    event.preventDefault();
    if (submit.disabled || !validateFields(form)) return;
    const datos = Object.fromEntries([...new FormData(form)].filter(([key]) => key !== "afectado" && key !== "fecha_aviso")
      .map(([key, value]) => [key, value.trim()]));
    if (cancel) {
      datos.saldoLiquidacion ||= "0";
      datos.afectados = affected();
      if (!datos.afectados.length) return alertText(alert, "Elige los documentos afectados.");
    }
    if (modify) {
      datos.cargoModificacion ||= "0";
      datos.nuevo = {};
      for (const [name] of conditions) {
        datos.nuevo[name] = datos[name];
        delete datos[name];
      }
      if (!service && minutes(datos.nuevo.fechaSalida, datos.nuevo.horaSalida) <= minutes(datos.nuevo.fechaEntrada, datos.nuevo.horaEntrada)) {
        return fieldError(inputs.fechaSalida, "La salida debe ser posterior a la entrada.");
      }
    }
    if (inputs.horaInicio && inputs.horaFin.value <= inputs.horaInicio.value) {
      return fieldError(inputs.horaFin, "La hora de fin debe ser posterior a la hora de inicio.");
    }
    if (partial && (datos.horaAccesoInicio > datos.horaInicio || datos.horaAccesoFin < datos.horaFin)) {
      return fieldError(inputs.horaAccesoFin, "El horario de acceso debe cubrir el de la actividad.");
    }
    if (inputs.anticipo && cents(datos.anticipo) > cents(datos.precio)) {
      return fieldError(inputs.anticipo, "El anticipo no puede ser mayor que el precio.");
    }
    const payload = { clave, ...(r ? { reserva:r.reserva } : {}), ...(service ? { servicio:service.folio } : {}), datos };
    const warning = form.querySelector("[data-release], .hint[role='status']");
    const summary = warning && !warning.hidden ? '<p class="hint">' + escape(warning.textContent) + '</p>' : "";
    const scroll = window.scrollY;
    preview(payload, () => {
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = null;
      app.replaceChildren(view);
      submit.focus({ preventScroll:true });
      window.scrollTo(0, scroll);
    }, summary);
  };
}

function documents(notice) {
  clearTimeout(searchTimer);
  const view = screen(heading("Documentos", "Busca la reserva y sube sus documentos firmados.") +
    '<section class="card">' + field("search", "Buscar reserva", { value:"", type:"search", attrs:'autocomplete="off" aria-describedby="search-help"' }) +
    '<p class="sub" id="search-help">Por folio o por titular del mes del calendario.</p><div id="search-results"></div>' +
    '<p class="sub" role="status" hidden></p><p class="alert" role="alert" hidden></p></section><div id="file-record"></div>');
  const query = view.querySelector("#search");
  const results = view.querySelector("#search-results");
  const status = view.querySelector('[role="status"]');
  const alert = view.querySelector('[role="alert"]');
  const record = view.querySelector("#file-record");
  let selection = 0;
  async function openRecord(folio, documentFolio) {
    const current = ++selection;
    alertText(alert, "");
    record.replaceChildren();
    const wait = setTimeout(() => {
      if (view.isConnected && current === selection) alertText(status, "Cargando expediente…");
    }, 1000);
    const result = await call("reserva.detalle", { reserva:folio });
    clearTimeout(wait);
    if (!view.isConnected || current !== selection) return;
    alertText(status, "");
    if (result.ok) signing(record, result.reserva, documentFolio);
    else alertText(alert, message(result));
  }
  if (notice) {
    query.value = notice.reserva;
    openRecord(notice.reserva, notice.documento);
  }
  query.oninput = () => {
    selection++;
    clearTimeout(searchTimer);
    results.replaceChildren();
    record.replaceChildren();
    alertText(alert, "");
    alertText(status, "");
    const term = query.value.trim();
    if (!term) return;
    searchTimer = setTimeout(async () => {
      const isFolio = /^R-\d{4}-\d{4,}$/i.test(term);
      const wait = setTimeout(() => {
        if (view.isConnected && term === query.value.trim()) alertText(status, "Buscando reserva…");
      }, 1000);
      const response = isFolio ? await call("reserva.detalle", { reserva:term.toUpperCase() })
        : await call("calendario.rango", monthRange());
      clearTimeout(wait);
      if (!view.isConnected || term !== query.value.trim()) return;
      alertText(status, "");
      if (!response.ok && response.code !== "NOT_FOUND") return alertText(alert, message(response));
      const matches = !response.ok ? [] : isFolio ? [response.reserva] :
        [...new Map(response.recursos.flatMap(resource => resource.ocupaciones).filter(r =>
          r.titular?.toLocaleLowerCase("es-MX").includes(term.toLocaleLowerCase("es-MX")) ||
          r.reserva.toUpperCase().includes(term.toUpperCase())).map(r => [r.reserva, r])).values()];
      for (const r of matches) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "doc-entry full secondary";
        button.textContent = r.reserva + " · " + (r.titular || "Sin titular");
        button.onclick = () => openRecord(r.reserva);
        results.append(button);
      }
      if (!matches.length) alertText(status, "No encontramos reservas. Revisa el folio o el nombre.");
    }, 250);
  };
}

function signing(record, reservation, documentFolio) {
  record.innerHTML = '<section class="card"><h3 tabindex="-1">Expediente documental</h3><p>' +
    escape(reservation.reserva + " · " + (reservation.titular || "Sin titular")) + '</p>' +
    '<button class="link" data-view-reservation>Ver reserva</button>' + documentRows(reservation, true) + alertMarkup + "</section>";
  record.querySelector("[data-view-reservation]").onclick = () => detail(reservation.reserva);
  const buttons = [...record.querySelectorAll("[data-sign]")];
  const selected = buttons.find(button => reservation.documentos[button.dataset.sign].folio === documentFolio);
  (selected || record.querySelector("h3")).focus();
  documentLinks(record, reservation, record.querySelector("section > [role=alert]"));
  for (const button of buttons) {
    const doc = reservation.documentos[button.dataset.sign];
    const row = button.closest(".doc-entry");
    const input = row.querySelector('input[type="file"]');
    const alert = row.querySelector('[role="alert"]');
    const status = row.querySelector('[role="status"]');
    button.onclick = () => input.click();
    input.onchange = async () => {
      if (button.disabled) return;
      const file = input.files[0];
      input.value = "";
      if (!file) return;
      if (file.size === 0 || file.size > 10000000 || !/\.pdf$/i.test(file.name)) {
        alertText(alert, "Elige un PDF no vacío de hasta 10 MB.");
        return;
      }
      alertText(alert, "");
      buttons.forEach(control => { control.disabled = true; });
      const wait = setTimeout(() => alertText(status, "Subiendo el documento firmado…"), 1000);
      try {
        const url = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
        const r = await call("contrato.firmado", { reserva:reservation.reserva, documento:doc.folio, pdf_base64:url.split(",")[1] });
        if (!button.isConnected) return;
        if (!r.ok) return alertText(alert, message(r));
        const latest = await call("reserva.detalle", { reserva:reservation.reserva });
        if (!button.isConnected) return;
        signing(record, latest.ok ? latest.reserva : {
          ...reservation, documentos:[...reservation.documentos, { folio:doc.folio, tipo:doc.tipo + "_FIRMADO", archivo:r.archivo }]
        });
        if (!latest.ok) alertText(record.querySelector("section > [role=alert]"),
          "El firmado se guardó. Vuelve a abrir el expediente para ver el PDF.");
      } catch {
        if (button.isConnected) alertText(alert, "No se pudo leer el archivo. Selecciona el PDF de nuevo.");
      } finally {
        clearTimeout(wait);
        alertText(status, "");
        buttons.forEach(control => { control.disabled = false; });
        if (button.isConnected) button.focus();
      }
    };
  }
}

nav.addEventListener("click", event => {
  const button = event.target.closest("[data-section]");
  if (button && !nav.inert) navigate(button.dataset.section);
});

if (injected) {
  nav.hidden = false;
  navigate("calendar", false);
} else if (!CJ_CONFIG.API_URL || !CJ_CONFIG.CLIENT_ID) {
  screen(heading("Disponibilidad") + '<div class="card">Falta configurar la conexión para consultar las reservas.</div>', false);
} else {
  const signin = document.createElement("div");
  signin.id = "signin";
  signin.className = "card";
  app.before(signin);
  screen(heading("Disponibilidad") + "<p>Inicia sesión con Google para consultar las reservas.</p>", false);
  const googleScript = document.createElement("script");
  googleScript.src = "https://accounts.google.com/gsi/client";
  googleScript.async = true;
  googleScript.onload = () => {
    google.accounts.id.initialize({
      client_id:CJ_CONFIG.CLIENT_ID,
      callback(response) {
        token = response.credential;
        signin.hidden = true;
        if (nav.hidden) {
          nav.hidden = false;
          navigate("calendar");
        }
      }
    });
    google.accounts.id.renderButton(signin, { theme:"outline", size:"large", text:"signin_with" });
  };
  googleScript.onerror = () => { signin.textContent = "No se pudo cargar el inicio de sesión. Recarga la página para reintentar."; };
  document.head.append(googleScript);
}
</script>
